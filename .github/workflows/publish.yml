name: Publish MyWallpaper release through admission-v1

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    if: github.event.repository.private == false
    concurrency:
      group: mywallpaper-release-${{ github.repository_id }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    # The public promotion branch is discovery-only. Execution is pinned to the
    # exact commit that MyWallpaper independently allowlists server-side.
    uses: MyWallpapers/native-addon-toolchain/.github/workflows/native-addon-build.yml@65c96ef1723ed8146ff2e25c1ab24e568968b063
    with:
      channel: development
