<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=1280,height=720">
<title>Taskbar Accent thumbnail</title>
<style>
  * { box-sizing: border-box }
  html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden }
  body {
    position: relative; color: #f4f8ff; font-family: Inter, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 78% 23%, rgb(64 137 255 / 45%), transparent 31%),
      radial-gradient(circle at 14% 90%, rgb(177 66 255 / 26%), transparent 35%),
      linear-gradient(145deg, #07101f, #0b1730 52%, #10172c);
  }
  .glow { position: absolute; width: 520px; height: 520px; right: -80px; top: -140px; border-radius: 50%; background: rgb(53 142 255 / 20%); filter: blur(80px) }
  .copy { position: absolute; left: 78px; top: 88px; width: 520px }
  .eyebrow { color: #75b9ff; font-size: 16px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase }
  h1 { margin: 15px 0 18px; font-size: 72px; line-height: .95; letter-spacing: -.055em }
  p { width: 470px; margin: 0; color: rgb(235 244 255 / 70%); font-size: 21px; line-height: 1.5 }
  .modes { display: flex; gap: 10px; margin-top: 29px }
  .modes span { padding: 9px 14px; border: 1px solid rgb(255 255 255 / 13%); border-radius: 999px; background: rgb(255 255 255 / 7%); color: rgb(244 248 255 / 82%); font-size: 14px }
  .window { position: absolute; right: 72px; top: 66px; width: 520px; height: 455px; overflow: hidden; border: 1px solid rgb(255 255 255 / 15%); border-radius: 28px; background: linear-gradient(145deg, rgb(18 28 48 / 86%), rgb(12 18 34 / 74%)); box-shadow: 0 38px 100px rgb(0 0 0 / 45%); backdrop-filter: blur(24px) }
  .window header { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px; border-bottom: 1px solid rgb(255 255 255 / 8%); background: rgb(255 255 255 / 3%) }
  .window header i { width: 9px; height: 9px; border-radius: 50%; background: rgb(255 255 255 / 22%) }
  .preview { position: relative; height: 403px; background: radial-gradient(circle at 68% 23%, rgb(68 143 255 / 36%), transparent 35%), linear-gradient(160deg, #14243e, #0a1122 67%) }
  .preview::before { content: ""; position: absolute; inset: 0; opacity: .22; background-image: linear-gradient(rgb(255 255 255 / 4%) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 4%) 1px, transparent 1px); background-size: 34px 34px }
  .status { position: absolute; left: 28px; top: 28px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid rgb(111 233 164 / 20%); border-radius: 999px; color: #9af1be; background: rgb(57 171 108 / 10%); font-size: 13px }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: #72e7a4; box-shadow: 0 0 14px #72e7a4 }
  .taskbar { position: absolute; left: 30px; right: 30px; bottom: 24px; height: 68px; display: flex; align-items: center; justify-content: center; gap: 12px; border: 1px solid rgb(255 255 255 / 22%); border-radius: 20px; background: linear-gradient(120deg, rgb(42 120 233 / 36%), rgb(145 65 240 / 24%)), rgb(11 18 34 / 62%); box-shadow: inset 0 1px rgb(255 255 255 / 18%), 0 18px 42px rgb(0 0 0 / 38%), 0 0 32px rgb(41 139 255 / 28%); backdrop-filter: blur(28px) saturate(155%) }
  .icon { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgb(255 255 255 / 12%); border-radius: 11px; background: rgb(255 255 255 / 10%); box-shadow: inset 0 1px rgb(255 255 255 / 12%) }
  .windows { display: grid; grid-template-columns: repeat(2, 8px); gap: 3px }
  .windows b { width: 8px; height: 8px; background: #68aefc }
  .circle { border-radius: 50%; background: linear-gradient(145deg, #66b8ff, #5b6df6) }
  .folder { width: 21px; height: 16px; border-radius: 3px; background: #f2c95d; box-shadow: inset 0 3px rgb(255 255 255 / 24%) }
  .accent { position: absolute; left: 78px; bottom: 52px; font-size: 13px; color: rgb(232 243 255 / 58%); letter-spacing: .08em; text-transform: uppercase }
</style>
<body>
  <div class="glow"></div>
  <div class="copy"><div class="eyebrow">Native Windows styling</div><h1>Taskbar<br>Accent</h1><p>Apply a precise blur, acrylic, transparent or accent treatment to every Windows taskbar.</p><div class="modes"><span>Blur</span><span>Acrylic</span><span>Transparent</span><span>Accent</span></div></div>
  <section class="window"><header><i></i><i></i><i></i></header><div class="preview"><span class="status"><i></i> Native hook active</span><div class="taskbar"><span class="icon"><span class="windows"><b></b><b></b><b></b><b></b></span></span><span class="icon"><span class="circle" style="width:21px;height:21px"></span></span><span class="icon"><span class="folder"></span></span><span class="icon"><span class="circle" style="width:20px;height:20px;background:linear-gradient(145deg,#8ee4ff,#397dff)"></span></span><span class="icon"><span class="circle" style="width:20px;height:20px;background:linear-gradient(145deg,#ca8cff,#7d47f4)"></span></span></div></div></section>
  <div class="accent">One validated device profile · every taskbar</div>
</body>
</html>
