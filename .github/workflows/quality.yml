name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: taskbar-accent-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Enable the package manager pinned by package.json
        run: corepack enable pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the distributable
        run: pnpm build

      - name: Verify the distributable and native source
        run: pnpm test

  native:
    name: native-x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout add-on without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: addon
          persist-credentials: false

      - name: Checkout the exact trusted toolchain
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MyWallpapers/native-addon-toolchain
          ref: 175f795bec4351111c50c5ff7d2fa3f4f1b91b99
          path: toolchain
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: toolchain/.nvmrc

      - name: Verify and expand the canonical MyWallpaper CLI
        shell: pwsh
        run: |
          & toolchain/.github/scripts/expand-canonical-cli.ps1 `
            -ArtifactRoot toolchain/.github/canonical-cli `
            -Destination "$env:RUNNER_TEMP/mywallpaper-cli"

      - name: Generate bindings and compile the x64 hook
        shell: pwsh
        run: |
          Remove-Item -LiteralPath addon/native/generated -Recurse -Force -ErrorAction SilentlyContinue
          node "$env:RUNNER_TEMP/mywallpaper-cli/cli/dist/bin.js" generate --directory addon
          if ($LASTEXITCODE -ne 0) { throw 'Canonical binding generation failed' }
          & "$env:RUNNER_TEMP/mywallpaper-cli/cli/dist/windhawk/build-native-hooks.ps1" `
            -RepositoryRoot addon `
            -OutputRoot "$env:RUNNER_TEMP/mywallpaper-hooks-output"
